spring:
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true
      dialect: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: always

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  server:
    port: 8080

  kafka:
    bootstrap-servers: kafka:9092   # 컨테이너 네트워크 기준. 로컬 IDE 실행 시 localhost:9094로 오버라이드
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true      # 프로듀서 재시도로 인한 중복 발행 방지
        max.in.flight.requests.per.connection: 5
        retries: 3
    consumer:
      group-id: follow-count-consumer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false        # 수동 커밋으로 정확성 확보 (8번 항목에서 이유 설명)
      properties:
        spring.json.trusted.packages: "com.musicplace.follow.event"
    listener:
      type: batch
      ack-mode: MANUAL_IMMEDIATE
      concurrency: 3                   # 파티션 수와 맞춤

app:
  kafka:
    topic:
      follow-count-events: follow-count-events
      follow-count-events-dlt: follow-count-events.DLT

# =================================
#        Monitoring / Metrics
# =================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: music-place
    distribution:
      percentiles-histogram:
        http.server.requests: true   # ← ★ histogram 활성화 (필수)
      percentiles:
        http.server.requests: 0.5, 0.9, 0.95
    enable:
      jvm: true

  observations:
    http:
      server:
        requests:
          enabled: true              # ← HTTP 요청 관찰 활성화

  prometheus:
    metrics:
      export:
        enabled: true

  server:
    port: 8081

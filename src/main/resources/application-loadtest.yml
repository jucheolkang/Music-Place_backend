# src/main/resources/application-loadtest.yml
# 부하 테스트 전용 프로파일

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/musicplace?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20          # 부하 테스트를 위해 증가
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: HikariCP-LoadTest

  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: update
    show-sql: false                   # 부하 테스트 시 로그 최소화
    properties:
      hibernate.format_sql: false
      hibernate.dialect: org.hibernate.dialect.MySQLDialect
      hibernate.jdbc.batch_size: 20   # 배치 처리 최적화

  sql:
    init:
      mode: always

  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          max-active: 20              # 부하 테스트를 위해 증가
          max-idle: 10
          min-idle: 5

  kafka:
    bootstrap-servers: kafka:9092   # 컨테이너 네트워크 기준. 로컬 IDE 실행 시 localhost:9094로 오버라이드
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true      # 프로듀서 재시도로 인한 중복 발행 방지
        max.in.flight.requests.per.connection: 5
        retries: 3
    consumer:
      group-id: follow-count-consumer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false        # 수동 커밋으로 정확성 확보 (8번 항목에서 이유 설명)
      properties:
        spring.json.trusted.packages: "com.musicplace.follow.event"
    listener:
      type: batch
      ack-mode: MANUAL_IMMEDIATE
      concurrency: 3                   # 파티션 수와 맞춤

app:
  kafka:
    topic:
      follow-count-events: follow-count-events
      follow-count-events-dlt: follow-count-events.DLT


server:
  port: 8080
  tomcat:
    threads:
      max: 200                        # 부하 테스트를 위해 증가
      min-spare: 10
    accept-count: 100
    max-connections: 10000

# Monitoring / Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: music-place
      environment: loadtest
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.9, 0.95, 0.99
    enable:
      jvm: true

  observations:
    http:
      server:
        requests:
          enabled: true

  prometheus:
    metrics:
      export:
        enabled: true

  server:
    port: 8081

# Logging (부하 테스트 시 최소화)
logging:
  level:
    root: WARN
    org.musicplace: INFO
    org.hibernate.SQL: WARN
    org.springframework.web: WARN

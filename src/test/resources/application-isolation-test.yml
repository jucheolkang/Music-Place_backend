spring:
  datasource:
    url: jdbc:mysql://localhost:13306/${DOCKER_MYSQL_DATABASE}
    username: root
    password: ${DOCKER_MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: never

  data:
    redis:
      host: localhost
      port: 16379
      password: ${DOCKER_REDIS_PASSWORD}

JWT_SECRET: test-secret-key
JWT_ACCESS_TIME: 3600000

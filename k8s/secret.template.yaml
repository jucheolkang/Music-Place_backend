# k8s/secret.template.yaml (git에 커밋)
apiVersion: v1
kind: Secret
metadata:
  name: musicplace-secret
  namespace: musicplace
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
  REDIS_PASSWORD: "${REDIS_PASSWORD}"
  JWT_SECRET: "${JWT_SECRET}"
  YOUTUBE_API_KEY: "${YOUTUBE_API_KEY}"

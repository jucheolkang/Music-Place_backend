# app.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: musicplace-app
  namespace: musicplace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: musicplace-app
  template:
    metadata:
      labels:
        app: musicplace-app
    spec:
      containers:
        - name: app
          image: musicplace-app:local
          imagePullPolicy: Never       # 로컬 이미지를 그대로 사용 (레지스트리 조회 안 함)
          ports:
            - containerPort: 8080
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: musicplace-config
            - secretRef:
                name: musicplace-secret
          env:
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx1g -XX:+UseG1GC"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/musicplace"   # Service 이름이 곧 DNS 호스트명
            - name: SPRING_REDIS_HOST
              value: "redis"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 90
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: musicplace-app-svc
  namespace: musicplace
spec:
  selector:
    app: musicplace-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: actuator
      port: 8081
      targetPort: 8081
  type: NodePort

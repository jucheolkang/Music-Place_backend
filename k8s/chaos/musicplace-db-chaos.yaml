apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: musicplace-db-chaos
  namespace: musicplace
spec:
  appinfo:
    appns: musicplace
    applabel: app=mysql
    appkind: statefulset
  chaosServiceAccount: litmus-db-sa
  experiments:
    - name: pod-delete
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: '30'
            - name: CHAOS_INTERVAL
              value: '10'
            - name: FORCE
              value: 'false'
        probe:
          - name: "app-health-check"
            type: "httpProbe"
            mode: "Continuous"
            httpProbe/inputs:
              url: "http://musicplace-app-svc:8081/actuator/health"
              method:
                get:
                  criteria: "=="
                  responseCode: "200"
            runProperties:
              probeTimeout: 5
              interval: 5
              retry: 3

apiVersion: v1
kind: Service
metadata: { name: mysql-primary, namespace: musicplace }
spec:
  selector: { app: mysql, role: primary }
  ports: [{ port: 3306 }]
---
apiVersion: v1
kind: Service
metadata: { name: mysql-replica, namespace: musicplace }
spec:
  selector: { app: mysql, role: replica }
  ports: [{ port: 3306 }]

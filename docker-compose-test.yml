version: '3.9'

# ===================================
# Docker Network
# ===================================
networks:
  musicplace-network:
    driver: bridge

services:
  # ===================================
  # MySQL Database
  # ===================================
  mysql:
    image: mysql:8.0
    container_name: musicplace_mysql
    restart: always
    networks:
      - musicplace-network
    ports:
      - "13306:3306"
    volumes:
      - ./db/mysql/data:/var/lib/mysql
      - ./db/mysql/init:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: ${DOCKER_MYSQL_PASSWORD}
      MYSQL_DATABASE: ${DOCKER_MYSQL_DATABASE}
      MYSQL_CHARSET: ${DOCKER_MYSQL_CHARSET}
      MYSQL_COLLATION: ${DOCKER_MYSQL_COLLATION}
      TZ: ${DOCKER_TZ}

  # ===================================
  # Redis Cache
  # ===================================
  redis:
    image: redis:7.0
    container_name: musicplace_redis
    restart: always
    networks:
      - musicplace-network
    ports:
      - "16379:6379"
    volumes:
      - ./db/redis/data:/data
    command: ["redis-server", "--requirepass", "${DOCKER_REDIS_PASSWORD}"]
    environment:
      TZ: ${DOCKER_TZ}

  # ===================================
  # Spring Boot Application
  # ===================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: musicplace_app
    restart: always
    networks:
      - musicplace-network
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: loadtest

      MYSQL_ROOT_PASSWORD: ${DOCKER_MYSQL_PASSWORD}
      REDIS_PASSWORD: ${DOCKER_REDIS_PASSWORD}

      JAVA_OPTS: "-Xms512m -Xmx1g -XX:+UseG1GC"

      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TIME: ${JWT_ACCESS_TIME}

      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}

  # ===================================
  # Prometheus
  # ===================================
  prometheus:
    image: prom/prometheus:latest
    container_name: musicplace_prometheus
    restart: always
    networks:
      - musicplace-network
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    depends_on:
      - app

  # ===================================
  # Grafana
  # ===================================
  grafana:
    image: grafana/grafana:latest
    container_name: musicplace_grafana
    restart: always
    networks:
      - musicplace-network
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_healthy
      alertmanager:
        condition: service_started

  # ===================================
  # k6
  # ===================================
  k6:
    image: grafana/k6:latest
    container_name: musicplace_k6
    networks:
      - musicplace-network
    volumes:
      - ./load-test:/scripts
      - ./load-test/results:/results
    depends_on:
      - app
    profiles:
      - test

  # ===================================
  # Loki
  # ===================================
  loki:
    image: grafana/loki:2.9.8
    container_name: musicplace_loki
    restart: always
    networks:
      - musicplace-network
    ports:
      - "3100:3100"
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml
      - loki-data:/loki

  # ===================================
  # Promtail
  # ===================================
  promtail:
    image: grafana/promtail:2.9.8
    container_name: musicplace_promtail
    restart: always
    networks:
      - musicplace-network
    command:
      - "-config.file=/etc/promtail/promtail-config.yml"
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      - ./logs:/logs
    depends_on:
      - loki

  # ===================================
  # Alertmanager
  # ===================================
  alertmanager:
    image: prom/alertmanager:latest
    container_name: musicplace_alertmanager
    restart: always
    networks:
      - musicplace-network
    ports:
      - "9093:9093"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml

  # ===================================
  # Kafka
  # ===================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: musicplace_kafka
    restart: always
    networks:
      - musicplace-network
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      CLUSTER_ID: "musicplace-local-cluster"

    healthcheck:
      test:
        [
          "CMD",
          "/opt/kafka/bin/kafka-broker-api-versions.sh",
          "--bootstrap-server",
          "localhost:9092"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===================================
  # Kafka UI
  # ===================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: musicplace_kafka_ui
    restart: always
    networks:
      - musicplace-network
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: musicplace
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

# ===================================
# Volumes
# ===================================
volumes:
  grafana-data:
  prometheus-data:
  loki-data:

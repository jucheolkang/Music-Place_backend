version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: musicplace_mysql
    restart: always
    ports:
      - "13306:3306"  # 로컬에서 MySQL Workbench 등으로 접근 가능
    volumes:
      - ./db/mysql/data:/var/lib/mysql
      - ./db/mysql/init:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: ${DOCKER_MYSQL_PASSWORD}
      MYSQL_DATABASE: ${DOCKER_MYSQL_DATABASE}
      MYSQL_CHARSET: ${DOCKER_MYSQL_CHARSET}
      MYSQL_COLLATION: ${DOCKER_MYSQL_COLLATION}
      TZ: ${DOCKER_TZ}

  redis:
    image: redis:7.0
    container_name: musicplace_redis
    restart: always
    ports:
      - "16379:6379"  # 로컬에서 redis-cli 등으로 접근 가능
    volumes:
      - ./db/redis/data:/data
    command: ["redis-server", "--requirepass", "${DOCKER_REDIS_PASSWORD}"]
    environment:
      TZ: ${DOCKER_TZ}

  # ===================================
  # Kafka (KRaft 모드, 단일 브로커)
  # ===================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: musicplace_kafka
    restart: always
    networks:
      - musicplace-network
    ports:
      - "9092:9092"
      - "9094:9094"   # 추가: 호스트(IDE)에서 접속할 포트
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094   # EXTERNAL 추가
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "musicplace-local-cluster"
    healthcheck:
      test: [ "CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092" ]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: musicplace_kafka_ui
    restart: always
    networks:
      - musicplace-network
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: musicplace
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
